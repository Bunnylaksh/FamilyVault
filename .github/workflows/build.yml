name: Build FamilyVault Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build FamilyVault APK
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout FamilyVault
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            autopoint \
            gettext

      - name: Prepare autotools
        run: |
          libtoolize --force --copy
          autoreconf --version
          autoconf --version
          automake --version

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            buildozer==1.6.0 \
            Cython==0.29.37 \
            setuptools

      - name: Check build environment
        run: |
          python --version
          buildozer --version
          python -m pip show buildozer
          python -m pip show Cython

      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        run: |
          # Disable grp and pwd modules before build
          export P4A_SKIP_MODULES="grp,pwd"
          buildozer android debug      

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FamilyVault-APK
          path: bin/*.apk

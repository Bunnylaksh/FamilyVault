name: Build FamilyVault Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build FamilyVault APK
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout FamilyVault
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
            sudo apt update
            sudo apt install -y \
              git \
              zip \
              unzip \
              openjdk-17-jdk \
              autoconf \
              automake \
              libtool \
              libtool-bin \
              pkg-config \
              zlib1g-dev \
              libncurses-dev \
              libtinfo6 \
              cmake \
              libffi-dev \
              libssl-dev \
              autopoint \
              gettext
              
      - name: Prepare autotools
        run: |
          libtoolize --force --copy
          autoreconf --version
          autoconf --version
          automake --version

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer setuptools

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FamilyVault-APK
          path: bin/*.apk
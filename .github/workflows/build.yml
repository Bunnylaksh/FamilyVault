name: Build FamilyVault Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build FamilyVault APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout FamilyVault
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.6"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            autopoint \
            gettext

      - name: Prepare autotools
        run: |
          libtoolize --force --copy
          autoreconf --version
          autoconf --version
          automake --version

      - name: Install Buildozer and dependencies
        run: |
          python -m pip install --upgrade "pip<24" setuptools wheel

          python -m pip install \
            buildozer==1.6.0 \
            Cython==0.29.37

          python -m pip install tea "cup>=3.0.30"

      - name: Show environment info
        run: |
          python --version
          python -m pip --version
          buildozer --version
          python -m pip show buildozer
          python -m pip show Cython

      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        shell: bash
        env:
            ANDROIDNDK: ${{ env.ANDROID_NDK }}
            ANDROIDAPI: 34
            ANDROIDMINAPI: 21
        
        run: |
          set -euo pipefail

          cat > "$GITHUB_WORKSPACE/android.config.site" <<'EOF'
          ac_cv_header_grp_h=no
          ac_cv_func_setgrent=no
          ac_cv_func_getgrent=no
          ac_cv_func_endgrent=no
          ac_cv_func_getgrouplist=no
          ac_cv_func_initgroups=no
          EOF

          export CONFIG_SITE="$GITHUB_WORKSPACE/android.config.site"

          echo "ANDROIDNDK=$ANDROIDNDK"
          echo "ANDROIDAPI=$ANDROIDAPI"
          echo "ANDROIDMINAPI=$ANDROIDMINAPI"

          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FamilyVault-APK
          path: bin/*.apk
